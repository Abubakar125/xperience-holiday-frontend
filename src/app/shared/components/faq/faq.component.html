<section class="faq">
  <div class="faq__inner">

    <h2 class="faq__heading">Frequently Asked Questions</h2>
    <p class="faq__sub">We're committed to offering more than just products — we provide exceptional experiences.</p>

    <div class="faq__list">
      @for (item of faqs; track item.id; let first = $first) {
        <details class="faq-item" [open]="first">
          <summary class="faq-item__q">
            {{ item.question }}
            <span class="faq-item__arrow" aria-hidden="true">
              <img class="faq-item__arrow-up" src="icons/arrow-up.svg" alt="" />
              <img class="faq-item__arrow-down" src="icons/arrow-down.svg" alt="" />
            </span>
          </summary>
          <div class="faq-item__a">{{ item.answer }}</div>
        </details>
      }
    </div>

  </div>
</section>
